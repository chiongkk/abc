<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Farm Dashboard - Lite Version</title>

<style>
body {
  font-family: Arial;
  background: #f4f6f8;
  margin: 0;
}

.header {
  background: #2c7a3f;
  color: white;
  padding: 15px;
  text-align: center;
  font-size: 20px;
}

.controls {
  padding: 10px;
  background: white;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
}

input, select {
  padding: 8px;
  border-radius: 5px;
  border: 1px solid #ccc;
}

#downloadBtn {
  display: block;
  padding: 8px 16px;
  background: #2c7a3f;
  color: white;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  font-size: 14px;
  min-height: 36px;
}

#downloadBtn:hover {
  background: #256d35;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 15px;
  padding: 15px;
}

.card {
  background: white;
  border-radius: 10px;
  padding: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  cursor: pointer;
  transition: 0.2s;
}

.card:hover {
  transform: scale(1.02);
}

.alert {
  border-left: 6px solid red;
}

.plot {
  font-weight: bold;
  font-size: 18px;
  color: #2c7a3f;
}

.empty {
  background: #7f8c8d;
}

.status {
  display: inline-block;
  padding: 4px 10px;
  border-radius: 15px;
  color: white;
  font-size: 12px;
  margin-top: 5px;
}

.growing { background: #2ecc71; }
.soon    { background: #f39c12; }
.ready   { background: #e74c3c; }
.weeding { background: #9b59b6; }

.small {
  font-size: 13px;
  color: #555;
  margin-top: 4px;
}

.card img {
  width: 100%;
  border-radius: 8px;
  margin-top: 8px;
}

.task-summary {
  display: flex;
  gap: 10px;
  align-items: center;
  margin-left: 10px;
  font-weight: bold;
}

.task-summary span {
  background: #eee;
  padding: 5px 10px;
  border-radius: 15px;
  font-size: 12px;
}

.emoji {
  font-size: 2em;
}

/* Phone styles */
@media only screen and (max-width: 600px) {
  .controls {
    flex-direction: column !important;
    align-items: stretch !important;
    overflow: visible !important;
  }

  .controls input,
  .controls select,
  .controls button {
    display: block !important;
    width: 100% !important;
    box-sizing: border-box !important;
    visibility: visible !important;
    opacity: 1 !important;
    min-height: 36px !important;
  }

  .task-summary {
    flex-wrap: wrap;
    margin-left: 0;
    width: 100%;
  }

  .grid {
    grid-template-columns: repeat(2, 1fr) !important;
    gap: 8px !important;
    padding: 8px !important;
  }

  .card {
    padding: 8px !important;
  }

  .plot {
    font-size: 13px !important;
  }

  .card img {
    display: none !important;
  }

  .small {
    font-size: 11px !important;
  }

  .status {
    font-size: 10px !important;
    padding: 3px 6px !important;
  }

  .emoji {
    font-size: 1em !important;
  }
}
</style>
</head>

<body>

<div class="header">🌿 Lite Farm Management System</div>

<div class="controls">
  <input type="text" id="search" placeholder="Search plot or plant..." oninput="render()">
 
  <a href="farm-map.html" style="display:inline-block; padding:8px 16px; background:#2c7a3f; color:white; border-radius:5px; text-decoration:none; font-size:14px; min-height:36px; line-height:20px;">🗺️ Map</a>
  <a href="noticeboard.html" style="display:inline-block; padding:8px 16px; background:#2c7a3f; color:white; border-radius:5px; text-decoration:none; font-size:14px;">📋 Notice Board</a>

  <button onclick="showNextWeekHarvest()" style="padding:8px 16px; background:#e67e22; color:white; border:none; border-radius:5px; cursor:pointer; font-size:14px; min-height:36px;">
    📅 Next Week's Harvest
  </button>
  
  <a href="#" onclick="openHarvesting()" style="display:inline-block; padding:8px 16px; background:#2c7a3f; color:white; border-radius:5px; text-decoration:none; font-size:14px;">🌾 Harvesting Data</a>
  
  <button id="downloadBtn" onclick="downloadCSVFromSheet()">📥 Download History</button> 

  <select id="filter" onchange="render()">
    <option value="all">All</option>
    <option value="ready">Harvest Ready</option>
    <option value="soon">Manuring Soon</option>
    <option value="weeding">Weeding Needed</option>
    <option value="empty">Empty</option>
  </select>

  <select id="sort" onchange="render()">
    <option value="none">Sort: Default</option>
    <option value="urgent">Sort: Urgency</option>
  </select>

  <div class="task-summary">
    <span id="taskHarvest">🔴 0 Harvest Ready</span>
    <span id="taskManure">🟡 0 Manure Today</span>
    <span id="taskWeeding">🟣 0 Weeding Needed</span>
  </div>
</div>

<div class="grid" id="grid"></div>

<script>
// 1. CHANGE THIS URL to your new, smaller JSON dataset file if hosted online
// For example: "https://github.io"
const DATA_URL = ""; 

let farmData = {};

// 2. ALTERNATIVE: If you don't have a live URL yet, this local sample data will load automatically
const fallbackData = {
  "Plot A1": { "plant": "Lettuce", "staff": "Alex", "datePlanted": "2026-09-01", "estHarvest": "2026-10-05", "nextManure": "2026-10-02", "nextWeeding": "2026-10-10", "images": ["https://placeholder.com"] },
  "Plot B3": { "plant": "Chilli", "staff": "Sam", "datePlanted": "2026-08-15", "estHarvest": "2026-10-01", "nextManure": "2026-09-28", "nextWeeding": "2026-09-30", "images": ["https://placeholder.com"] },
  "Plot C2": { "plant": "Empty", "staff": "None", "datePlanted": "-", "estHarvest": "-", "nextManure": "-", "nextWeeding": "-", "images": [] }
};

function getStatus(data) {
  const today = new Date();
  if (!data.plant || data.plant.trim() === "" || data.plant.toLowerCase() === "empty") {
    return { text: "Empty Plot", class: "empty", priority: 0 };
  }

  const harvest = new Date(data.estHarvest  + "T00:00:00");
  const manure  = new Date(data.nextManure  + "T00:00:00");
  const weeding = new Date(data.nextWeeding + "T00:00:00");

  const harvestDiff = Math.floor((harvest - today) / (1000 * 60 * 60 * 24));
  const manureDiff  = Math.floor((manure  - today) / (1000 * 60 * 60 * 24));
  const weedDiff    = Math.floor((weeding - today) / (1000 * 60 * 60 * 24));

  if (harvestDiff <= 0)  return { text: "Harvest Ready",      class: "ready",   priority: 1 };
  if (manureDiff  <= 0)  return { text: "Ready for Manuring", class: "soon",    priority: 2 };
  if (manureDiff  <= 3)  return { text: "Manuring Soon",      class: "soon",    priority: 3 };
  if (weedDiff    <= 0)  return { text: "Weeding Needed",     class: "weeding", priority: 4 };

  return { text: "No Action Needed", class: "growing", priority: 5 };
}

function render() {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  let items = Object.keys(farmData).map(k => ({ plot: k, ...farmData[k] }));
  const search = document.getElementById("search").value.toLowerCase();
  const filter = document.getElementById("filter").value;
  const sort   = document.getElementById("sort").value;

  items = items.filter(item => {
    const status = getStatus(item);
    if (search && !item.plot.toLowerCase().includes(search) && !item.plant.toLowerCase().includes(search)) return false;
    if (filter !== "all" && status.class !== filter) return false;
    return true;
  });

  updateTaskSummary(items);

  if (sort === "urgent") {
    items.sort((a, b) => getStatus(a).priority - getStatus(b).priority);
  }

  items.forEach(item => {
    const status = getStatus(item);
    const card = document.createElement("div");
    card.className = "card";
    if (status.priority <= 2) card.classList.add("alert");
    card.onclick = () => { window.location.href = "index.html?plot=" + item.plot; };

    card.innerHTML = `
      <div class="plot">${item.plot}</div>
      <div>${item.plant}</div>
      <div class="status ${status.class}">${status.text}</div>
      <div class="small"><span class="emoji">👨‍🌾</span> ${item.staff}</div>
      <div class="small"><span class="emoji">📅</span> ${item.datePlanted}</div>
      <div class="small"><span class="emoji">🌾</span> ${item.estHarvest}</div>
      <img src="${item.images && item.images[0] ? item.images[0] : ''}" onerror="this.style.display='none'">
      <div style="text-align:center; font-size:11px; color:#aaa; margin-top:6px;">👆 Tap for details</div>
    `;
    grid.appendChild(card);
  });
}

function updateTaskSummary(items) {
  let harvest = 0, manure = 0, weeding = 0;
  items.forEach(item => {
    const s = getStatus(item);
    if (s.class === "ready")   harvest++;
    if (s.class === "soon")    manure++;
    if (s.class === "weeding") weeding++;
  });
  // FIXED: Repaired original code truncation here
  document.getElementById("taskHarvest").innerText = "🔴 " + harvest + " Harvest Ready";
  document.getElementById("taskManure").innerText  = "🟡 " + manure  + " Manure Today";
  document.getElementById("taskWeeding").innerText = "🟣 " + weeding + " Weeding Needed";
}

// 3. NEW: Automatically fetch online data or gracefully fall back to local sample data
async function initDashboard() {
  if (DATA_URL) {
    try {
      const response = await fetch(DATA_URL + "?v=" + new Date().getTime());
      farmData = await response.json();
    } catch (e) {
      console.error("Failed fetching live data, using fallback.", e);
      farmData = fallbackData;
    }
  } else {
    farmData = fallbackData;
  }
  render();
}

// Stub functions to prevent browser console errors on click events
function showNextWeekHarvest() { alert("Next Week's Harvest Clicked"); }
function openHarvesting() { alert("Harvesting Data Clicked"); }
function downloadCSVFromSheet() { alert("Downloading CSV..."); }

// Run setup when page opens
window.onload = initDashboard;
</script>

</body>
</html>
